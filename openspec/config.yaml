schema: spec-driven

context: |
  Proyecto de tesis: prototipo de marketplace hiperlocal para comercios
  de Córdoba.
  La arquitectura aceptada está documentada en
  Doc/architecture/ADR-001-layered-architecture.md.
  Backend: monolito ASP.NET Core en proyectos tradicionales
  Marketplace.Api, Marketplace.BLL, Marketplace.DAL, Marketplace.IoC,
  Marketplace.DTOs y Marketplace.Models. Marketplace.Utility se crea
  únicamente cuando exista una utilidad concreta.
  Frontend: Next.js con TypeScript.
  Persistencia: PostgreSQL con PostGIS.

  Alcance funcional futuro: catálogo y stock por comercio,
  descubrimiento geoespacial, exposición equitativa y borradores
  opcionales asistidos por IA. Toda sugerencia de IA requiere confirmación
  y alternativa manual; la IA no participa en el ranking.

  Estado vigente: scaffold, onboarding y guía pública implementados.
  La guía incluye búsqueda textual, rubro, rediseño visual Cerca y
  descubrimiento espacial con zona manual, geolocalización, radio y distancia.
  Perfil público con galería y gestión de hasta cinco fotos implementado.
  Utility procesa imágenes sin dependencias de las capas; IoC adapta a BLL.
  Actividad implementada: eventos visibles, deduplicación, contexto protegido,
  retención de 30 días y métricas privadas con períodos 7/30 días.
  Ranking offline de negocios implementado: motor BLL, métricas, cuatro variantes
  y piloto reproducible con tres semillas; sin activación pública. Ablaciones de
  novedad/rotación completas y reproducibles. Protocolo, rúbrica y contrato de
  integración redactados. Criterios principales acordados el 21/09; importación
  CSV de juicios implementada con cobertura y resoluciones. Paquetes de
  entrenamiento/calibración preparados, con recolección verificable y notas vacías.
  Comparación de calibración implementada con historial completo, juicios verificados,
  agregados por superficie y diferencias pareadas; sin decisión de aceptación.
  Comprobador de criterios/suficiencia y grilla de 18 celdas implementados;
  selección provisional separa acuerdos de salvaguardas propuestas, sin congelar política.
  Borrador para congelamiento preparado con fuentes/originales/binarios y verificador
  de integridad por hash externo. Reconstrucción de esa copia verificada: seis archivos
  runtime y cuatro salidas de pendientes idénticos bajo SDK/Git/PathMap registrados.
  No hay política congelada; faltan entrenamiento/anotación y cierre metodológico.
  Faltan anotación humana, material de reserva y runner final.
  Primera publicación persistente implementada con historia desconocida para registros
  anteriores. Lector BLL/DAL de candidatos completos implementado; 62/62 HTTP/PostGIS.
  Adaptador de revista implementado el 04/10: contexto por zona/rubro/4 km,
  historia desconocida explícita N=0. Verificado: 95/95 BLL y 62/62 HTTP/PostGIS.
  Snapshots/ledger internos implementados: transacción, reintentos, secuencia,
  traza completa, paginación revalidada y purga automática. 99/99 BLL y 72/72 HTTP.
  Siguiente incremento: endpoints/cursor protegido y controles, después UI;
  activación sujeta a evaluación/política. Catálogo y pedidos siguen pendientes.

  Idioma: documentación en español; identificadores técnicos de código en
  inglés.
  Método: strict TDD. Cada comportamiento se define con una prueba que
  falla antes de escribir su implementación, seguida por el mínimo cambio
  para pasar y una refactorización segura.

  Toolchain fijado: .NET SDK 10.0.400, Next.js 16.3.4, Node.js 24.20.0 y
  npm 11.19.0. Revalidar compatibilidad antes de cambiar dependencias.

  Runners previstos: backend con xUnit mediante `dotnet test`; frontend con
  Vitest y Testing Library mediante `npm test`; validación de producción
  con `npm run build`. Las versiones y scripts definitivos se fijan en el
  diseño del primer slice. Las pruebas DAL futuras usan una instancia real
  aislada de PostgreSQL/PostGIS, nunca EF Core InMemory.

rules:
  proposal:
    - Escribir en español y abrir con el resultado esperado.
    - >-
      Delimitar explícitamente alcance, fuera de alcance, dependencias y
      criterios de éxito.
    - >-
      Para el primer slice no incluir funcionalidades de negocio ni crear
      archivos en App/ durante init.
    - Revalidar versiones externas antes de proponerlas como fijas.
  specs:
    - Expresar requisitos observables con escenarios verificables.
    - >-
      Incluir happy path, errores relevantes y límites entre frontend, API
      y base de datos.
    - >-
      Mantener la IA fuera del ranking y exigir confirmación y fallback
      manual cuando corresponda.
    - >-
      No convertir decisiones pendientes de proveedor o versión en
      requisitos confirmados.
  design:
    - >-
      Respetar ADR-001 y mantener dependencias acíclicas; BLL no referencia
      DAL.
    - >-
      Justificar cada proyecto, paquete e integración; no crear Utility ni
      Integrations sin uso real.
    - >-
      Definir estrategia de configuración, conectividad, pruebas y rollback
      sin secretos.
    - >-
      Mantener cada cambio dentro del presupuesto de revisión de 400 líneas
      o dividirlo en PRs encadenados.
  tasks:
    - >-
      Ordenar trabajo en ciclos strict TDD: prueba roja, implementación
      mínima, refactorización.
    - >-
      Asociar cada tarea a un requisito y a un comando de verificación
      reproducible.
    - >-
      Mantener cambios pequeños y no mezclar scaffold con funcionalidades
      de negocio.
    - >-
      Incluir pruebas y documentación en la misma unidad de trabajo que el
      comportamiento.
